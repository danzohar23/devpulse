services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@postgres:5432/pulse
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
    command: uvicorn pulse.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@postgres:5432/pulse
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
    command: python -m pulse.ingestion.worker

volumes:
  pgdata:
